<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣找廁所</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1565c0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--sub:#5b6570;--line:#e3e6ea;--accent:#1565c0;--accent-t:#fff;--chip:#e3effc}
@media (prefers-color-scheme:dark){:root{--bg:#101316;--card:#1a1f24;--text:#eef1f4;--sub:#9aa5b1;--line:#2a3138;--accent:#7db3f5;--accent-t:#08203f;--chip:#1d2f45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.go{width:100%;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-t);font-size:18px;font-weight:700}
.go:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.q{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font-size:16px}
#map{height:42vh;min-height:260px;border-radius:14px;border:1px solid var(--line);margin:12px 0;z-index:0}
.pin{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-t);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#msg{margin:12px 0;color:var(--sub);font-size:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.item.sel{border:2px solid var(--accent)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:700;font-size:17px}
.ds{color:var(--accent);font-weight:700;white-space:nowrap}
.ad{color:var(--sub);font-size:14px;margin:2px 0 8px}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tg span{background:var(--chip);border-radius:8px;padding:2px 8px;font-size:13px}
.row{display:flex;gap:8px}
.row a,.row button{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);text-decoration:none;font-weight:700;font-size:16px}
</style>
</head>
<body>
<main>
<h1>🚻 台灣找廁所</h1>
<button class="go" id="go">找離我最近的廁所</button>
<div class="chips" id="chips">
<button class="chip" data-m="1" aria-pressed="false">無障礙</button>
<button class="chip" data-m="2" aria-pressed="false">親子廁所</button>
<button class="chip" data-m="8" aria-pressed="false">尿布檯</button>
<button class="chip" data-m="4" aria-pressed="false">性別友善</button>
</div>
<input class="q" id="q" type="search" placeholder="或輸入地點或地址，例如：台中火車站" aria-label="搜尋地點或地址">
<div id="map"></div>
<div id="msg">資料載入中…</div>
<div id="list"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var D=[],pos=null,mask=0,rows=[];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dist(a,b,c,d){var r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.sqrt(x*x+y*y)*6371000}
function fmt(m){return m<1000?Math.round(m/10)*10+' 公尺':(m/1000).toFixed(1)+' 公里'}

var map=L.map('map',{zoomControl:true}).setView([23.7,120.9],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap 貢獻者'}).addTo(map);
var layer=L.layerGroup().addTo(map),me=null;

function focus(i,fromList){
  var els=document.querySelectorAll('.item');
  for(var k=0;k<els.length;k++)els[k].classList.toggle('sel',k===i);
  if(fromList){map.setView([rows[i].t[2],rows[i].t[3]],Math.max(map.getZoom(),17));$('map').scrollIntoView({behavior:'smooth',block:'start'})}
  else{els[i].scrollIntoView({behavior:'smooth',block:'center'})}
}

function render(fit){
  var q=$('q').value.trim().toLowerCase(),all=[];
  for(var i=0;i<D.length;i++){
    var t=D[i];
    if(mask&&(t[4]&mask)!==mask)continue;
    if(q&&(t[0]+t[1]).toLowerCase().indexOf(q)<0)continue;
    all.push({t:t,d:pos?dist(pos.lat,pos.lng,t[2],t[3]):0});
  }
  if(pos)all.sort(function(a,b){return a.d-b.d});
  var n=all.length;rows=all.slice(0,20);
  var h='';layer.clearLayers();
  rows.forEach(function(r,i){
    var t=r.t,tags='';
    if(t[4]&1)tags+='<span>♿ 無障礙</span>';
    if(t[4]&2)tags+='<span>👶 親子</span>';
    if(t[4]&8)tags+='<span>尿布檯</span>';
    if(t[4]&4)tags+='<span>性別友善</span>';
    var url='https://www.google.com/maps/dir/?api=1&destination='+t[2]+','+t[3]+'&travelmode=walking';
    h+='<div class="item"><div class="top"><div class="nm">'+(i+1)+'. '+esc(t[0])+'</div>'+(pos?'<div class="ds">'+fmt(r.d)+'</div>':'')+'</div><div class="ad">'+esc(t[1])+'</div>'+(tags?'<div class="tg">'+tags+'</div>':'')+'<div class="row"><button data-i="'+i+'">在地圖上看</button><a href="'+url+'" target="_blank" rel="noopener">導航</a></div></div>';
    L.marker([t[2],t[3]],{icon:L.divIcon({className:'',html:'<div class="pin">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).on('click',function(){focus(i,false)}).addTo(layer);
  });
  $('list').innerHTML=h;
  if(!n)$('msg').textContent='找不到符合條件的廁所。';
  else if(pos)$('msg').textContent='依距離排序，顯示最近 '+rows.length+' 間（符合條件共 '+n+' 間）。';
  else $('msg').textContent='尚未取得你的位置，以下為搜尋結果（'+n+' 間），未依距離排序。';
  if(fit&&rows.length){
    var pts=rows.slice(0,5).map(function(r){return[r.t[2],r.t[3]]});
    if(pos)pts.push([pos.lat,pos.lng]);
    if(pts.length>1)map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:17});
    else map.setView(pts[0],16);
  }
}

$('list').onclick=function(e){var b=e.target.closest('button[data-i]');if(b)focus(+b.dataset.i,true)};
$('go').onclick=function(){
  var b=$('go');
  if(!D.length){$('msg').textContent='資料還在載入，請稍候再試。';return}
  if(!navigator.geolocation){$('msg').textContent='這個瀏覽器不支援定位，請改用搜尋框。';return}
  b.disabled=true;b.textContent='定位中…';
  navigator.geolocation.getCurrentPosition(function(p){
    pos={lat:p.coords.latitude,lng:p.coords.longitude};
    if(me)map.removeLayer(me);
    me=L.circleMarker([pos.lat,pos.lng],{radius:9,color:'#fff',weight:3,fillColor:'#f57c00',fillOpacity:1}).addTo(map);
    b.disabled=false;b.textContent='重新定位';render(true);
  },function(e){
    b.disabled=false;b.textContent='找離我最近的廁所';
    $('msg').textContent=e.code===1?'位置權限被拒絕。請到瀏覽器的網站設定允許位置，或改用搜尋框。':'無法取得位置（'+e.message+'）。請到戶外或稍後再試，或改用搜尋框。';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
};
$('chips').onclick=function(e){
  var b=e.target.closest('.chip');if(!b)return;
  var m=+b.dataset.m,on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',on);mask=on?(mask|m):(mask&~m);
  if(pos||$('q').value.trim())render(true);
};
var tm;$('q').oninput=function(){clearTimeout(tm);tm=setTimeout(function(){render(true)},300)};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
fetch('toilets.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
  D=j;$('msg').textContent='資料已載入（'+D.length+' 個地點）。點上方按鈕開始。';
}).catch(function(e){$('msg').textContent='資料載入失敗（'+e.message+'）。請確認 toilets.json 已上傳到同一個專案。'});
</script>
</body>
</html>
